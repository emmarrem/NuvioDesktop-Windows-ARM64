name: Inspect failed ARM64 build
on:
  push:
    paths: [.github/workflows/windows-arm64-log-tail.yml]
permissions:
  actions: read
jobs:
  inspect:
    runs-on: windows-11-arm
    steps:
      - name: Read failed Gradle output
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          Invoke-WebRequest "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/jobs/117688116307/logs" -Headers $headers -OutFile "$env:RUNNER_TEMP/build.log"
          Get-Content "$env:RUNNER_TEMP/build.log" -Tail 220
