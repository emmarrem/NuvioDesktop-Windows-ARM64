name: Build Windows ARM64

on:
  schedule:
    - cron: '23 * * * *'
  release:
    types: [published]
  push:
    branches: [Dev]
    paths:
      - .github/workflows/build-windows-arm64.yml
      - scripts/windows/**
      - ports/windows-arm64/**
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Official NuvioMedia release tag, or latest'
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: windows-arm64-release
  cancel-in-progress: false

jobs:
  watch:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      conflict_marker: ${{ steps.select.outputs.conflict_marker }}
      tag: ${{ steps.select.outputs.tag }}
      publish: ${{ steps.select.outputs.publish }}
      revision: ${{ steps.select.outputs.revision }}
    steps:
      - uses: actions/github-script@v8
        id: select
        env:
          INPUT_TAG: ${{ inputs.release_tag || 'latest' }}
        with:
          script: |
            if (context.eventName === 'release') {
              const tag = context.payload.release.tag_name;
              const revision = tag.match(/-arm64(?:\.(\d+))?$/);
              if (!revision) throw new Error('Use an ARM64 fork release tag ending in -arm64.N.');
              core.setOutput('tag', tag.slice(0, revision.index));
              core.setOutput('revision', revision[1] || '1');
              return;
            }
            const releases = await github.paginate(github.rest.repos.listReleases,
              {owner:'NuvioMedia',repo:'NuvioDesktop',per_page:100});
            const requested = process.env.INPUT_TAG;
            const candidates = releases.filter(r => !r.draft && (requested === 'latest' || r.tag_name === requested))
              .sort((a,b) => Date.parse(b.published_at)-Date.parse(a.published_at));
            const release = candidates[0];
            if (!release) throw new Error('No matching upstream release.');
            if (!/^[a-zA-Z0-9][a-zA-Z0-9._+-]*$/.test(release.tag_name)) throw new Error('Invalid upstream tag');
            const names = release.assets.map(a => a.name);
            if (!names.includes('SHA256SUMS.txt') || !names.some(n => /(?:x64|x86_64).*\.msi$/i.test(n))) {
              core.info('Upstream installer/checksums are not ready; next hourly check will retry.');
              return;
            }
            // 0.1.36 already shipped as a ZIP only. Publish the installer/updater as a new revision.
            const revision = release.tag_name === '0.1.36-alpha' ? '2' : '1';
            const tag = release.tag_name + '-arm64.' + revision;
            try {
              const {data:existing} = await github.rest.repos.getReleaseByTag({...context.repo,tag});
              if (!existing.draft) {
                const assets = existing.assets.map(a=>a.name);
                if (!assets.includes('build-info.json') || !assets.some(n=>n.endsWith('-portable.zip')) ||
                    !assets.some(n=>n.endsWith('-portable.zip.sha256'))) throw new Error('Existing public release is incomplete; repair manually.');
                core.info('ARM64 release already published: '+tag);
                return;
              }
            } catch (error) { if (error.status !== 404) throw error; }
            const {data:tagRef} = await github.rest.git.getRef({
              owner: 'NuvioMedia', repo: 'NuvioDesktop', ref: 'tags/' + release.tag_name
            });
            const marker = 'arm64-port-conflict-' + release.id + '-' + tagRef.object.sha + '-' + context.sha;
            if (context.eventName === 'schedule') {
              const {data} = await github.rest.actions.listArtifactsForRepo({...context.repo, name: marker});
              const previous = data.artifacts.find(a => !a.expired && a.workflow_run?.head_sha === context.sha && a.workflow_run?.head_branch === context.ref.replace('refs/heads/', ''));
              if (previous) {
                await core.summary.addRaw('Skipping the previously reported port conflict for ' + release.tag_name +
                  '. [Original run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
                  '/actions/runs/' + previous.workflow_run.id + '). A manual run can retry immediately.').write();
                return;
              }
            }
            core.setOutput('conflict_marker', marker);
            core.setOutput('tag', release.tag_name);
            core.setOutput('revision', revision);
            core.setOutput('publish', 'true');
  build:
    needs: watch
    if: needs.watch.outputs.tag != ''
    permissions:
      contents: write
    runs-on: windows-11-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve official release and verify client installer
        id: release
        env:
          RELEASE_TAG: ${{ needs.watch.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fork release may use 0.1.30-alpha-arm64.1 while its source stays 0.1.30-alpha.
          $upstreamTag = $env:RELEASE_TAG -replace '-arm64(?:\.\d+)?$', ''
          ./scripts/windows/resolve-upstream-release.ps1 -Tag $upstreamTag -OutputDirectory release-input
      - uses: actions/checkout@v6
        with:
          repository: NuvioMedia/NuvioDesktop
          ref: ${{ steps.release.outputs.tag }}
          path: source
      - name: Apply versioned ARM64 port to selected release
        id: port
        run: ./scripts/windows/apply-release-port.ps1 -SourceDirectory source
      - name: Identify a source merge conflict
        if: failure() && steps.port.outcome == 'failure' && needs.watch.outputs.conflict_marker != ''
        id: conflict
        run: |
          $unmerged = git -C source diff --name-only --diff-filter=U
          if ($LASTEXITCODE) { throw 'Unable to inspect the failed merge.' }
          if ($unmerged) {
            $unmerged | Set-Content "$env:RUNNER_TEMP/arm64-port-conflict.txt"
            'confirmed=true' >> $env:GITHUB_OUTPUT
          }
      - name: Remember this conflict for scheduled release checks
        if: failure() && steps.conflict.outputs.confirmed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.watch.outputs.conflict_marker }}
          path: ${{ runner.temp }}/arm64-port-conflict.txt
          retention-days: 90
      - name: Configure optional custom client
        env:
          CONFIG_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if ($env:CONFIG_BASE64) {
            [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE/custom-client.properties", [Convert]::FromBase64String($env:CONFIG_BASE64))
          }
      - name: Build and test native ARM64 app
        env:
          ARM64_REVISION: ${{ needs.watch.outputs.revision }}
        run: |
          $options = @{
            SourceDirectory = "$env:GITHUB_WORKSPACE/source"
            WorkDirectory = "$env:GITHUB_WORKSPACE/build/windows-arm64"
            OfficialInstaller = "$env:GITHUB_WORKSPACE/release-input/official-windows.msi"
            RunTests = $true
            ReleaseRevision = [int]$env:ARM64_REVISION
          }
          if (Test-Path custom-client.properties) { $options.LocalProperties = "$env:GITHUB_WORKSPACE/custom-client.properties" }
          ./scripts/windows/build-arm64.ps1 @options
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build and smoke-test the ARM64 Windows installer
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
          ARM64_REVISION: ${{ needs.watch.outputs.revision }}
        run: |
          ./scripts/windows/build-arm64-installer.ps1 -AppDirectory source/composeApp/build/compose/binaries/main-release/app/Nuvio -OutputDirectory build/windows-arm64 -VersionName $env:UPSTREAM_TAG -Revision $env:ARM64_REVISION -SmokeTest
      - name: Record source revisions
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $record = [ordered]@{
            release = $env:RELEASE_TAG
            upstreamCommit = (git -C source rev-parse HEAD)
            portCommit = (git rev-parse HEAD)
            architecture = 'arm64'
            signed = $false
          } | ConvertTo-Json
          $record | Set-Content build/windows-arm64/build-info.json -Encoding utf8NoBOM
          "Built Windows ARM64 release **$env:RELEASE_TAG**. Download the portable ZIP from this run's artifacts, extract it, and run Nuvio.exe." | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: Nuvio-Windows-arm64-${{ steps.release.outputs.tag }}
          path: |
            build/windows-arm64/Nuvio-Windows-arm64-*-portable.zip
            build/windows-arm64/Nuvio-Windows-arm64-*.msi
            build/windows-arm64/Nuvio-Windows-arm64-*.sha256
            build/windows-arm64/build-info.json
          if-no-files-found: error
          retention-days: 30
      - name: Attach ARM64 files to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: ./scripts/windows/upload-release-assets.ps1 -Repository $env:GITHUB_REPOSITORY -ReleaseId $env:RELEASE_ID -Tag $env:RELEASE_TAG -Directory build/windows-arm64
      - name: Publish tested ARM64 release
        if: needs.watch.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
          ARM64_REVISION: ${{ needs.watch.outputs.revision }}
          MAKE_LATEST: ${{ !inputs.release_tag || inputs.release_tag == 'latest' }}
        run: |
          $tag = "$env:UPSTREAM_TAG-arm64.$env:ARM64_REVISION"
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to replace a public release.' }
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target (git rev-parse HEAD) --draft --title "Nuvio Windows ARM64 $env:UPSTREAM_TAG" --notes "Unofficial unsigned Windows ARM64 build of https://github.com/NuvioMedia/NuvioDesktop/releases/tag/$env:UPSTREAM_TAG . Run the ARM64 MSI for Start menu access and in-app update checks, or extract the portable ZIP and run Nuvio.exe. Source revisions are recorded in build-info.json."
            if ($LASTEXITCODE) { throw 'Could not create draft release.' }
          }
          $files = @(Get-ChildItem build/windows-arm64 -File | Where-Object { $_.Name -match '^Nuvio-Windows-arm64-.+(?:-portable\.zip|\.msi)(?:\.sha256)?$' -or $_.Name -eq 'build-info.json' })
          if ($files.Count -ne 5) { throw 'Expected MSI, ZIP, both checksums and build information.' }
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber @($files.FullName)
          if ($LASTEXITCODE) { throw 'Release upload failed; draft retained.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false "--latest=$env:MAKE_LATEST"
          if ($LASTEXITCODE) { throw 'Release publication failed.' }
      - name: Remove temporary client configuration
        if: always()
        run: |
          Remove-Item -LiteralPath source/local.properties, custom-client.properties -Force -ErrorAction SilentlyContinue
      - name: Save build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Windows-arm64-build-diagnostics
          path: |
            build/windows-arm64/*.log
            source/composeApp/build/test-results/desktopTest/*.xml
          if-no-files-found: ignore
          retention-days: 7